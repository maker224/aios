[package]
name = "aios-relay"
version = "0.1.0"
edition = "2021"
description = "AIoS cloud relay — forwards encrypted sync traffic between devices in the same group."

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
