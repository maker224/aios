name: aios
description: >-
  AIoS — All-in-One Sync. Sync files, photos, contacts, calendars, clipboard
  and notes between iOS, macOS, Android and Windows. Local Wi-Fi P2P first,
  cloud relay fallback.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  hive: ^2.2.3
  path_provider: ^2.1.4

  # Identity / info
  device_info_plus: ^10.1.0
  uuid: ^4.4.0

  # Cryptography
  cryptography: ^2.7.0
  crypto: ^3.0.5

  # Platform data access
  file_picker: ^8.1.2
  photo_manager: ^3.3.0
  flutter_contacts: ^1.1.9
  device_calendar: ^4.3.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
